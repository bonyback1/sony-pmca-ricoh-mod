name: CI & Integrity Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: |
          python -m py_compile tools/*.py

      - name: Verify Smali Hook generation
        run: |
          python tools/generate_ricoh_hook.py --output /tmp/test_RicohHook.smali
          diff -u src/smali/RicohHook.smali /tmp/test_RicohHook.smali

      - name: Test CLI arguments
        run: |
          python tools/generate_ricoh_hook.py --help
          python tools/sign_apk.py --help
          python tools/update_menu_data.py --help
          bash -n scripts/install.sh
